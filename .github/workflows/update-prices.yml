# 毎日 1 回、楽天市場から GPU・CPU の参考価格を取り直して GitHub Pages に公開し直す。
# コードを main に push したときも公開し直す（そのときは価格は取らず、保存済みの価格を使う）。
# 楽天のキーはリポジトリの Settings → Secrets and variables → Actions に登録する:
#   RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_REFERER（公開サイトの URL）
name: 価格更新と公開

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00（日本時間）
  workflow_dispatch: # Actions 画面から手動でも実行できる

permissions:
  contents: write # 取得した価格をリポジトリに保存する
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 楽天市場から価格を取得
        if: github.event_name != 'push'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "::warning::楽天のキーが未登録のため、価格の取得を飛ばしました（保存済みの価格で公開します）"
            exit 0
          fi
          node tools/fetch-prices.mjs

      # NVIDIA公式の一部仕様を取得。取得エラーは警告とし、掲載値との不一致は後続の検証で公開を止める。
      - name: 公式仕様と照合
        if: github.event_name != 'push'
        continue-on-error: true
        run: node tools/check-specs.mjs

      - name: 取得した価格を保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/gpu-prices.js data/cpu-prices.js data/gpu-official.js; do
            [ -f "$f" ] && git add -A "$f"
          done
          if git diff --cached --quiet; then
            echo "価格に変化なし"
          else
            git commit -m "参考価格・公式仕様の照合結果を自動更新（$(TZ=Asia/Tokyo date +%F)）"
            git push
          fi

      - name: 掲載データと出典の整合性を検証
        run: |
          node tools/validate-data.mjs
          node tools/audit-hardware.mjs
          node --check js/app.js
          node --check js/categories.js
          node --check js/verification.js
          node --check js/performance.js
          node --check tools/collect-performance.mjs

      # 公開するのはサイト本体だけ（tools/ や server.mjs は含めない）
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          # Pages は JS・CSS を 10 分間ブラウザに保存させるので、公開ごとに版番号を付けて古いファイルが使われないようにする
          v=$(git rev-parse --short HEAD)
          sed -i -E "s#(src|href)=\"((css|js|data)/[^\"?]+)\"#\1=\"\2?v=${v}\"#g" _site/index.html
          grep -c "?v=${v}" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
